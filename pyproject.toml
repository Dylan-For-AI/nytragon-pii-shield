[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nytragon-pii-shield"
version = "0.1.0"
description = "Mask sensitive data (emails, phones, French SSN) before sending text to an LLM."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]